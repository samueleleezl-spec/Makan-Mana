<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Makan Mana{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="nav">
  <a class="logo" href="{{ url_for('home') }}"><span class="logo-mark">&#127836;</span>Makan Mana</a>
  <div class="auth">
    {% if g.user %}
      <a class="btn btn-ghost btn-sm" href="{{ url_for('auth.me') }}">{{ g.user['display_name'] }}</a>
      <a class="btn btn-solid btn-sm" href="{{ url_for('auth.logout') }}">Log out</a>
    {% else %}
      <a class="btn btn-ghost btn-sm" href="{{ url_for('auth.login') }}">Log in</a>
      <a class="btn btn-solid btn-sm" href="{{ url_for('auth.register') }}">Sign up</a>
    {% endif %}
  </div>
</header>

<main>
  {% for msg in get_flashed_messages() %}
    <p class="flash">{{ msg }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

</body>
</html>
