{% extends "base.html" %}
{% block title %}Log in &middot; Makan Mana{% endblock %}
{% block content %}
<form class="card" method="post">
  <h1>Welcome back</h1>
  <p class="sub">No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autofocus>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>

  <button class="btn btn-solid full" type="submit">Log in</button>
  <p class="sub center"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a></p>
</form>
{% endblock %}
