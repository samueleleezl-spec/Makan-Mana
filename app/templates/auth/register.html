{% extends "base.html" %}
{% block title %}Sign up &middot; Makan Mana{% endblock %}
{% block content %}
<form class="card" method="post">
  <h1>Make an account</h1>
  <p class="sub">Already got one? <a href="{{ url_for('auth.login') }}">Log in</a></p>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autofocus placeholder="you@example.com">

  <label for="display_name">Name</label>
  <input id="display_name" name="display_name" type="text" required placeholder="what your friends call you">

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>

  <button class="btn btn-solid full" type="submit">Sign up</button>
</form>
{% endblock %}
